%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/esp,esp32s31-lp-aon-clkrst.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32-S31 low-power always-on clock and reset registers

description:
  The LP_AON_CLKRST register block contains low-power clock and reset controls,
  including the CPLL divider configuration consumed by the main clock
  controller.

maintainers:
  - Armando Dou <douyiwen@espressif.com>

properties:
  compatible:
    items:
      - const: esp,esp32s31-lp-aon-clkrst
      - const: syscon

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    syscon@20701000 {
        compatible = "esp,esp32s31-lp-aon-clkrst", "syscon";
        reg = <0x20701000 0x400>;
    };

...
